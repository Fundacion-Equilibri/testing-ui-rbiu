name: Playwright Tests

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Reemplaza la siguiente URL con la de tu aplicación desplegada
      BASE_URL: ${{ secrets.BASE_URL }}
      EUTAXIA_EMAIL: ${{ secrets.EUTAXIA_EMAIL }}
      EUTAXIA_PASSWORD: ${{ secrets.EUTAXIA_PASSWORD }}
      SECOND_EUTAXIA_EMAIL: ${{ secrets.SECOND_EUTAXIA_EMAIL }}
      SECOND_EUTAXIA_PASSWORD: ${{ secrets.SECOND_EUTAXIA_PASSWORD }}
      PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
      CI: 2

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar tests
        run: npx playwright test

      - name: Guardar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 20

      - name: Deploy report to Netlify
        if: always()
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=playwright-report
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

