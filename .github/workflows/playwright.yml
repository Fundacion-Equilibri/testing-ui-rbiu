name: Playwright Tests

on:
  push:
    branches: ["main"] # o la rama donde quieras ejecutar
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Reemplaza la siguiente URL con la de tu aplicación desplegada
      BASE_URL: https://mi-app.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar tests
        run: npx playwright test

      - name: Guardar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 20
